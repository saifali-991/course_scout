# CourseScout frontend — static SPA + API proxy.
#
# Served by the `frontend` container. Every API-ish path is forwarded to the
# Django container (Compose service name: `backend`, gunicorn on 8000), so the
# browser only ever talks to http://localhost and CORS never enters the picture.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build output can be cached forever (Vite renames the file on change).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django: JSON API, admin, collected static, uploaded media.
    # `resolver` + a variable makes nginx look the address up per request, so it
    # starts fine even if the backend container isn't up yet (and follows it
    # across restarts) — plain `proxy_pass http://backend:8000;` would resolve
    # once at startup and fail the whole config.
    location ~ ^/(api|admin|static|media)(/|$) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # SPA fallback: any other path → index.html so react-router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
