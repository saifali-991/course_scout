# CourseScout on Render — one blueprint, two services.
#
#   API   → Django + gunicorn   (rootDir: backend,  Python 3.11)
#   Web   → the built React bundle served as a static site (rootDir: frontend)
#
# Apply it from the repo root (Render CLI installed):
#     render blueprint apply
# …or push the repo and pick "New +" → "Blueprint" in the Render dashboard.
#
# After it deploys:
#   1. open the API URL → /api/stats/ should return JSON
#   2. fill the *sync: false* vars on the API service (your MySQL credentials,
#      the site's ALLOWED_HOSTS, and CORS_ALLOWED_ORIGINS = the web service URL)
#   3. set VITE_API_URL on the web service to the API URL (e.g.
#      https://coursescout-api.onrender.com) and redeploy it — Vite bakes that
#      value into the bundle at build time.
#
# NOTE: Render's own managed database is Postgres, while this project talks to
# MySQL — so point DB_* at an external MySQL (Aiven / Clever Cloud / …). DB_SSL
# is already switched on below; add DB_SSL_CA if the provider hands you a CA file.

services:
  # ---------- Django API ----------
  - type: web
    name: coursescout-api
    runtime: python
    rootDir: backend
    plan: free   # Render's current free-tier Plan ID (0.1 CPU / 512 MB) — valid, do not remove
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Same entrypoint as Docker: migrate → seed only if the DB is empty → gunicorn
    startCommand: sh docker-entrypoint.sh gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/stats/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false   # e.g. coursescout-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://coursescout-web.onrender.com
      - key: DB_HOST
        sync: false   # your MySQL host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false   # optional path/content of the provider's CA
      - key: SEED_ON_FIRST_RUN
        value: "1"

  # ---------- React static site ----------
  - type: web
    name: coursescout-web
    runtime: static
    rootDir: frontend
    # Static sites have NO compute plan on Render (always free), so `plan` must
    # NOT be set here — Render rejects it with "no such plan free for service
    # type web" (this service is services[1] in that error).
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # the API URL, e.g. https://coursescout-api.onrender.com
    # Single-page app: any unknown path falls back to index.html (react-router).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
